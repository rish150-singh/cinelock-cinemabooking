services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinelock
      POSTGRES_PASSWORD: cinelock
      POSTGRES_DB: cinelock
    ports: ["5432:5432"]
    volumes: ["cinelock-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinelock"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  cinelock-db:
